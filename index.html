<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta name="robots" content="index,follow" />
    <title>Adrenaline Fitness</title>
    <meta
      name="description"
      content="Adrenaline Fitness — фитнесс, йогийн төвийн албан ёсны цахим хуудас."
    />
    <meta http-equiv="refresh" content="1;url=https://adrenaline-fitness.javkhlanbaataru.chatgpt.site/" />
    <link rel="canonical" href="https://adrenaline-fitness.javkhlanbaataru.chatgpt.site/" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #ffffff;
        background:
          radial-gradient(circle at 50% 20%, rgba(239, 50, 54, 0.28), transparent 38%),
          #070707;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: linear-gradient(145deg, #ff4b4f, #c90811);
        box-shadow: 0 18px 50px rgba(239, 50, 54, 0.32);
        font-size: 34px;
        font-weight: 900;
        font-style: italic;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 10vw, 48px);
        line-height: 0.95;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }

      h1 span {
        color: #ef3236;
      }

      p {
        margin: 18px auto 26px;
        color: #bcbcbc;
        font-size: 15px;
        line-height: 1.6;
      }

      a {
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 22px;
        border-radius: 14px;
        color: #ffffff;
        background: #ef3236;
        text-decoration: none;
        font-size: 16px;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(239, 50, 54, 0.28);
      }

      .loading {
        width: 38px;
        height: 3px;
        margin: 22px auto 0;
        overflow: hidden;
        border-radius: 99px;
        background: #252525;
      }

      .loading::after {
        content: "";
        display: block;
        width: 55%;
        height: 100%;
        background: #ef3236;
        animation: move 0.8s ease-in-out infinite alternate;
      }

      @keyframes move {
        to {
          transform: translateX(82%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading::after {
          animation: none;
        }
      }
    </style>
    <script>
      window.setTimeout(function () {
        var target = "https://adrenaline-fitness.javkhlanbaataru.chatgpt.site/";
        window.location.replace(target + window.location.search + window.location.hash);
      }, 700);
    </script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>Adrenaline <span>Fitness</span></h1>
      <p>Таныг албан ёсны цахим хуудас руу холбож байна.</p>
      <a href="https://adrenaline-fitness.javkhlanbaataru.chatgpt.site/">Сайтыг нээх</a>
      <div class="loading" aria-label="Уншиж байна"></div>
    </main>
  </body>
</html>
